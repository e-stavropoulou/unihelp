<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <title>UniHelp</title>

  <base href="/" />

  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png" />

  <!-- Manifest (μία φορά, χωρίς duplicates) -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <meta name="theme-color" content="#8C1310" />

  <!-- iOS Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="UniHelp" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-icon-180.png" />
  <!-- προαιρετικά κι άλλα: 120/152/167/180 -->
  <!--
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/icons/apple-icon-120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/apple-icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/assets/icons/apple-icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-icon-180.png" />
  -->

  <!-- Ionicons (OK όπως το είχες) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
  <ion-app>
  <app-root></app-root>
  <noscript>Ενεργοποίησε το JavaScript για να χρησιμοποιήσεις την εφαρμογή.</noscript>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(function(registration) {
          console.log('✅ Service Worker Registered:', registration);
        }).catch(function(err) {
          console.error('❌ SW registration failed:', err);
        });
    }
  </script>
  </ion-app>
</body>
</html>
