<ion-footer>
  <ion-toolbar class="footer-toolbar">
    <div class="footer-nav">
      <ion-icon name="book-outline" [routerLink]="['/notes-feed']"></ion-icon>
      <ion-icon name="search-outline" [routerLink]="['/search-users']"></ion-icon>

      <!-- 💬 Εικονίδιο chat με badge -->
      <div class="icon-with-badge" [routerLink]="['/chat']">
        <ion-icon name="chatbubble-ellipses-outline" class="notification-icon"></ion-icon>
        <ng-container *ngIf="unreadMessages$ | async as msgCount">
          <ion-badge *ngIf="msgCount > 0" class="notif-badge">
            {{ msgCount }}
          </ion-badge>
        </ng-container>
      </div>

      <ion-icon name="person-outline" [routerLink]="['/profile']"></ion-icon>

      <!-- 🔔 Εικονίδιο ειδοποιήσεων με badge -->
      <div class="icon-with-badge" [routerLink]="['/notifications']">
        <ion-icon name="notifications-outline" class="notification-icon"></ion-icon>
        <ng-container *ngIf="unreadCount$ | async as count">
          <ion-badge *ngIf="count > 0" class="notif-badge">
            {{ count }}
          </ion-badge>
        </ng-container>
      </div>

      <ion-icon name="log-out-outline" (click)="logout()"></ion-icon>
    </div>
  </ion-toolbar>
</ion-footer>
