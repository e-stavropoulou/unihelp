<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/notes-feed" (click)="goBack($event)"></ion-back-button>
    </ion-buttons>    
    <ion-title>Αναφορά</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-box">
    <form (ngSubmit)="submitReport()">

      <!-- 🔖 Κατηγορία -->
      <label class="form-label">Κατηγορία</label>
      <ion-item class="custom-ion-select">
        <ion-select
          interface="alert"
          placeholder="Επίλεξε κατηγορία"
          [(ngModel)]="category"
          name="category"
          required
        >
          <ion-select-option value="Spam">Spam</ion-select-option>
          <ion-select-option value="Ακατάλληλο">Ακατάλληλο περιεχόμενο</ion-select-option>
          <ion-select-option value="Παρενόχληση">Παρενόχληση</ion-select-option>
          <ion-select-option value="Λάθος Μάθημα">Λάθος Μάθημα</ion-select-option>
          <ion-select-option value="Διπλότυπο">Διπλότυπο</ion-select-option>
          <ion-select-option value="Χαμηλής Ποιότητας">Χαμηλής Ποιότητας</ion-select-option>
          <ion-select-option value="Παραπλανητικό Περιεχόμενο">Παραπλανητικό Περιεχόμενο</ion-select-option>
          <ion-select-option value="Πνευματικά Δικαιώματα">Πνευματικά Δικαιώματα</ion-select-option>
          <ion-select-option value="Ακατάλληλη Συμπεριφορά στα Σχόλια">Ακατάλληλη Συμπεριφορά στα Σχόλια</ion-select-option>
          <ion-select-option value="Άλλο">Άλλο</ion-select-option>
        </ion-select>
      </ion-item>
      

      <label class="form-label">Περιγραφή</label>
      <textarea
        [(ngModel)]="description"
        name="description"
        class="custom-input"
        rows="4"
        placeholder="Προαιρετική περιγραφή"
      ></textarea>

      <ion-button
        expand="block"
        type="submit"
        class="custom-red-btn"
        [disabled]="!category"
      >
        Υποβολή
      </ion-button>

    </form>
  </div>
</ion-content>
