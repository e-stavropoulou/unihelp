<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile" class="custom-back"></ion-back-button>
    </ion-buttons>
    <ion-title>Χρειάζομαι βοήθεια</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="signup-step2-container">
  <div class="form-wrapper">
    <h1>Χρειάζομαι βοήθεια</h1>
    <p class="instructions">
      Διάλεξε τα μαθήματα στα οποία χρειάζεσαι υποστήριξη για να σε βοηθήσει η κοινότητα του UniHelp!
    </p>

    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filterCourses()"
      (ionFocus)="onFocus()"
      (ionBlur)="onBlur()"
      placeholder="Αναζήτηση μαθήματος"
    ></ion-searchbar>

    <ion-list class="course-list-box" *ngIf="isFocused && filteredCourses.length > 0">
      <ion-item
      *ngFor="let course of filteredCourses"
      button
      detail="false"
      (click)="toggleCourse(course)"
    >
      <div class="course-row">
        <span class="course-name">{{ course.name }}</span>
        <span class="course-semester">({{ course.semester }}ο)</span>
      </div>
      <ion-icon
        slot="end"
        [name]="isSelected(course.id) ? 'checkmark-circle' : 'ellipse-outline'"
        color="primary"
      ></ion-icon>
    </ion-item>

    </ion-list>

    <div class="selected-courses" *ngIf="allCoursesFilteredSelected().length > 0">
      <ion-chip *ngFor="let course of allCoursesFilteredSelected()">
        <ion-label class="course-row">
          <span class="course-name">{{ course.name }}</span>
          <span class="course-semester">({{ course.semester }}ο)</span>
        </ion-label>        
        <ion-icon
          name="close-circle"
          class="remove-icon"
          size="small"
          (click)="toggleCourse(course)"
        ></ion-icon>
      </ion-chip>
    </div>

    <ion-button expand="block" class="submit-btn" shape="round" (click)="saveChanges()">
      Αποθήκευση αλλαγών
    </ion-button>
  </div>
</ion-content>
