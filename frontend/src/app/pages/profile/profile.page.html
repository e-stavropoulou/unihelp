<ion-header>
  <ion-toolbar color="light">
    <ion-title>Το προφίλ μου</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding profile-content">
  <div class="profile-header">
    <div>
      <h2>Γεια σου, {{ userData?.username }} 👋</h2>
      <span class="upoints-tag">{{ userData?.upoints || 0 }} UPoints</span>
    </div>
    <div class="avatar-settings">
      <img
  [src]="avatarUrl || 'assets/img/placeholder-avatar.png'"
  alt="avatar"
  class="avatar-img"
/>

      <ion-button fill="outline" size="small" class="settings-icon-btn" [routerLink]="['/profile-settings']">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
      
    </div>
  </div>

  <ion-card class="info-card">
    <ion-card-content>
      <p><strong>Τμήμα:</strong><br>{{ userData?.department }}</p>
    </ion-card-content>
  </ion-card>

  <ion-card class="info-card">
    <ion-card-content>
      <p><strong>Μπορώ να βοηθήσω:</strong></p>
      <ul *ngIf="userData?.courses?.length > 0">
        <li *ngFor="let course of userData.courses">{{ course }}</li>
      </ul>
      <p *ngIf="!userData?.courses?.length">Δεν έχετε επιλέξει μαθήματα ακόμα.</p>
    </ion-card-content>
  </ion-card>

  <div class="button-row">
    <ion-button expand="block" class="custom-red-btn" routerLink="/upload-notes">
      Ανέβασε σημειώσεις
    </ion-button>    
    <ion-button expand="block" class="custom-red-btn" [routerLink]="['/my-notes']">
      Οι Σημειώσεις μου
    </ion-button>         
    <ion-button expand="block" fill="outline" class="custom-outline-btn" [routerLink]="['/favorite-notes']">
      <ion-icon name="heart-outline" slot="start"></ion-icon>
      Αγαπημένα
    </ion-button>      
  </div>
</ion-content> 

<app-footer-nav></app-footer-nav>
