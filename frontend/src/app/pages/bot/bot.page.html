<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title> Thinkerbell 🧚‍♀️ </ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="confirmClearMessages()">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- 💬 Περιοχή μηνυμάτων -->
<ion-content
  [fullscreen]="true"
  class="ion-padding"
  scroll-events="true"
  keyboard-offset="true"
  #content
>
  <div *ngFor="let msg of messages" [ngClass]="msg.role === 'user' ? 'user-msg' : 'bot-msg'">
    <div class="bubble">
      <strong *ngIf="msg.role === 'user'">👤 Εσύ:</strong>
      <strong *ngIf="msg.role === 'bot'">🪄 Thinkerbell:</strong>
      <p>{{ msg.text }}</p>
    </div>
  </div>

  <div *ngIf="isLoading" class="bot-msg">
    <div class="bubble loading">🧚‍♀️ Σκέφτομαι...</div>
  </div>

  <div style="height: 10px;"></div>
</ion-content>

<!-- ✏️ Input + κουμπί μέσα στο footer -->
<ion-footer class="chat-footer">
  <ion-item class="input-area">
    <ion-textarea
      [(ngModel)]="userInput"
      placeholder="Γράψε την ερώτησή σου..."
      autoGrow
    ></ion-textarea>
  </ion-item>

  <ion-button expand="block" (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">
    {{ isLoading ? 'Αποστολή...' : 'Αποστολή' }}
  </ion-button>
</ion-footer>
