<ion-header>
  <ion-toolbar>
    <ion-title>Ρυθμίσεις Προφίλ</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="saveChanges()" #form="ngForm">

    <div class="form-group">
      <label class="form-label">Ονοματεπώνυμο</label>
      <input
        [(ngModel)]="userData.full_name"
        name="full_name"
        required
        class="custom-input"
        type="text"
        placeholder="Π.χ. Νίκος Παπαδόπουλος"
      />
    </div>
    
    <div class="form-group">
      <label class="form-label">Username</label>
      <input
        [(ngModel)]="userData.username"
        name="username"
        required
        class="custom-input"
        type="text"
        placeholder="Π.χ. nikos123"
      />
    </div>
    
    <div class="form-group">
      <label class="form-label">Email</label>
      <input
        [(ngModel)]="userData.email"
        name="email"
        type="email"
        required
        class="custom-input"
        placeholder="Π.χ. stXXXXX@upatras.gr"
      />
    </div>
    
    <div class="form-group">
      <label class="form-label">Νέος Κωδικός</label>
      <input
        [(ngModel)]="newPassword"
        name="newPassword"
        type="password"
        class="custom-input"
        placeholder="••••••••"
      />
    </div>
    

    <div class="form-group">
      <label class="form-label">Μπορώ να βοηθήσω:</label>

      <ion-searchbar
        [(ngModel)]="searchTerm"
        [ngModelOptions]="{ standalone: true }"
        (ionInput)="filterCourses()"
        (ionFocus)="onFocus()"
        (ionBlur)="onBlur()"
        placeholder="Αναζήτηση μαθήματος"
      ></ion-searchbar>

      <div class="selected-courses" *ngIf="selectedCourseIds.length > 0">
        <ng-container *ngFor="let course of allCourses">
          <ion-chip *ngIf="selectedCourseIds.includes(course.id)">
            <ion-label class="course-row">
              <span class="course-name">{{ course.name }}</span>
              <span class="course-semester"> ({{ course.semester ? course.semester + 'ο' : course.type }})</span>
            </ion-label>
            <ion-icon
              name="close-circle"
              class="remove-icon"
              size="small"
              (click)="toggleCourse(course)"
            ></ion-icon>
          </ion-chip>
        </ng-container>        
      </div>

      <ion-list class="course-list-box" *ngIf="isFocused && filteredCourses.length > 0">
        <ion-item
          *ngFor="let course of filteredCourses"
          button
          detail="false"
          (click)="toggleCourse(course)"
        >
          <div class="course-row">
            <span class="course-name">{{ course.name }}</span>
            <span class="course-semester"> ({{ course.semester ? course.semester + 'ο' : course.type }})</span>
          </div>
          <ion-icon
            slot="end"
            [name]="isSelected(course.id) ? 'checkmark-circle' : 'ellipse-outline'"
            color="primary"
          ></ion-icon>
        </ion-item>
      </ion-list>
    </div>

    <div class="avatar-upload-wrapper">
      <label class="avatar-clickable">
        <input type="file" accept="image/*" hidden (change)="onAvatarChange($event)" />
        <img [src]="avatarUrl || 'assets/img/placeholder-avatar.png'" class="avatar-img-clickable" />
      </label>
      <div class="avatar-text">Αλλαγή avatar</div>
    </div>

    <ion-button expand="block" type="submit" color="primary" [disabled]="!changesMade()">
      Αποθήκευση Αλλαγών
    </ion-button>

  </form>
</ion-content>
