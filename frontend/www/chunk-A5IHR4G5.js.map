<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" class="custom-back"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="login-container">
  <div class="form-wrapper">
    <h1>Σύνδεση</h1>

    <ion-item lines="none"    >
    <input
      type="email"
      placeholder="π.χ. st1234567@ceid.upatras.gr"
      fill="solid"
      class="custom-input"
      [(ngModel)]="email"
      class="native-input" />
    </ion-item>
    

    <ion-item lines="none" class="password-item">
      <input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="********"
        class="native-input custom-input"
        [(ngModel)]="password"
      />
      <ion-icon
        slot="end"
        [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
        (click)="togglePasswordVisibility()"
        class="toggle-password-icon"
      ></ion-icon>
    </ion-item>
    <ion-button expand="block" class="login-btn" shape="round" (click)="login()">
      Σύνδεση
    </ion-button>

    <!-- EMFANISI MONO AN XREIASTEI -->
    <ion-button
      *ngIf="showResend"
      expand="block"
      fill="outline"
      color="medium"
      shape="round"
      (click)="resendVerification()"
    >
      Αποστολή ξανά email επιβεβαίωσης
    </ion-button>

    <div class="extra-links">
      <p>Ξέχασες τον κωδικό σου; <a routerLink="/forgot-password">Ανάκτηση</a></p>
      <p>Δεν έχεις λογαριασμό; <a routerLink="/signup-step1">Εγγραφή</a></p>
    </div>
  </div>
</ion-content>
