<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" class="custom-back"></ion-back-button>
    </ion-buttons>
    <ion-title>Επιβεβαίωση Email</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding">
  <div class="email-verified-wrapper">
    <div class="email-verified-box">
      <ion-icon name="mail" class="success-icon"></ion-icon>
      <h2 class="success-title">Η εγγραφή σου ολοκληρώθηκε!</h2>
      <p class="success-message">
        Σου στείλαμε ένα email επιβεβαίωσης στη διεύθυνση που δήλωσες. Παρακαλούμε έλεγξε το inbox (ή τα spam)
        και πάτησε τον σύνδεσμο για ενεργοποίηση του λογαριασμού σου.
      </p>
    </div>
  </div>
</ion-content>
