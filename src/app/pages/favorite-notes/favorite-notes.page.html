<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Αγαπημένες Σημειώσεις</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let note of favoriteNotes">
    <ion-card-header>
      <ion-card-title>{{ note.title }}</ion-card-title>
      <ion-card-subtitle>
        {{ note.course }} • {{ note.category }}
      </ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>{{ note.description || 'Χωρίς περιγραφή.' }}</p>
      <div class="upload-date">📅 Ανέβηκε στις: {{ note.upload_date }}</div>
      <div class="actions">
        <a [href]="note.filepath" target="_blank">📄 Άνοιγμα αρχείου</a>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-text color="medium" *ngIf="favoriteNotes.length === 0">
    <p style="text-align:center; margin-top: 2rem;">Δεν έχεις αγαπημένες σημειώσεις ακόμα.</p>
  </ion-text>
</ion-content>
